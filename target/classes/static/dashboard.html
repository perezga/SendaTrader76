<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>SendaTrader Dashboard</title>

    <link href="/webjars/bootstrap/css/bootstrap.min.css" rel="stylesheet">
    <script src="/webjars/jquery/jquery.min.js"></script>
    <script src="/webjars/sockjs-client/sockjs.min.js"></script>
    <script src="/webjars/stomp-websocket/stomp.min.js"></script>
    <script src="/webjars/bootstrap/js/bootstrap.min.js"></script>

    <script src="https://code.highcharts.com/stock/highstock.js"></script>
    <script src="https://code.highcharts.com/stock/modules/exporting.js"></script>

    <script src="/dashboard.js"></script>

    <style>
        body {
            padding-top: 50px;
        }

        .metric-value {
            font-size: 24px;
            font-weight: bold;
        }

        .profit {
            color: green;
        }

        .loss {
            color: red;
        }
    </style>
</head>

<body>

    <nav class="navbar navbar-inverse navbar-fixed-top">
        <div class="container-fluid">
            <div class="navbar-header">
                <a class="navbar-brand" href="#">SendaTrader 7.6</a>
            </div>
            <div id="connection-status" class="navbar-text navbar-right" style="margin-right: 15px;">
                <span class="label label-warning">Connecting...</span>
            </div>
        </div>
    </nav>

    <div class="container-fluid" style="margin-top: 20px;">

        <!-- Top Metrics Row -->
        <div class="row">
            <div class="col-md-3">
                <div class="panel panel-default">
                    <div class="panel-heading">Total Profit/Loss</div>
                    <div class="panel-body text-center">
                        <div id="total-pl" class="metric-value">0.00</div>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="panel panel-default">
                    <div class="panel-heading">Win / Loss Ratio</div>
                    <div class="panel-body text-center">
                        <span id="win-count" class="metric-value profit">0</span> W /
                        <span id="loss-count" class="metric-value loss">0</span> L
                    </div>
                </div>
            </div>
            <div class="col-md-6">
                <div class="panel panel-primary">
                    <div class="panel-heading">Current Open Position</div>
                    <div class="panel-body">
                        <div class="row">
                            <div class="col-xs-4">
                                <small>Type</small><br>
                                <span id="pos-type" class="metric-value">-</span>
                            </div>
                            <div class="col-xs-4">
                                <small>Entry Price</small><br>
                                <span id="pos-price" class="metric-value">-</span>
                            </div>
                            <div class="col-xs-4">
                                <small>Stop Loss</small><br>
                                <span id="pos-stoploss" class="metric-value">-</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Chart Row -->
        <div class="row">
            <div class="col-md-12">
                <div id="chart-container" style="height: 500px; min-width: 310px"></div>
            </div>
        </div>

        <!-- Detailed Tables Row -->
        <div class="row">
            <div class="col-md-6">
                <div class="panel panel-default">
                    <div class="panel-heading">Closed Positions History</div>
                    <div class="panel-body" style="max-height: 300px; overflow-y: auto;">
                        <table class="table table-striped table-condensed">
                            <thead>
                                <tr>
                                    <th>#</th>
                                    <th>Type</th>
                                    <th>Result (P/L)</th>
                                    <th>Accumulated</th>
                                </tr>
                            </thead>
                            <tbody id="closed-positions-body">
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
            <div class="col-md-6">
                <div class="panel panel-default">
                    <div class="panel-heading">Event Log</div>
                    <div class="panel-body" style="max-height: 300px; overflow-y: auto;">
                        <ul id="event-log" class="list-group">
                        </ul>
                    </div>
                </div>
            </div>
        </div>

    </div>

</body>

</html>
